<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080f">
  <title>JARVIS · bağlantı yok</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #05080f; color: #e9f2f8; font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif; padding: 1.5rem; text-align: center; }
    .card { max-width: 420px; }
    .orb { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 50%; border: 1px solid rgba(142, 224, 255, 0.4); box-shadow: 0 0 28px rgba(142, 224, 255, 0.2); }
    h1 { font-size: 1.3rem; font-weight: 500; margin: 0 0 0.5rem; }
    p { color: #a9bccb; line-height: 1.5; margin: 0.4rem 0; }
    small { color: #6f8597; }
    button { margin-top: 1.2rem; min-height: 44px; padding: 0.6rem 1.4rem; border-radius: 10px; border: none; background: #8ee0ff; color: #03131c; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="orb"></div>
    <h1>Bilgisayara ulaşılamıyor</h1>
    <p>JARVIS bilgisayarında çalışır. Bu ekran telefonda saklı bir kabuktur; asistanın kendisi burada çalışmaz.</p>
    <p><small>Bilgisayarın açık ve çevrimiçi, JARVIS'in çalışıyor ve telefonda Tailscale bağlı olmalı.</small></p>
    <button type="button" onclick="location.reload()">Yeniden dene</button>
  </div>
</body>
</html>
