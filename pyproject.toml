[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS - Just A Rather Very Intelligent System"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai==3.3.0",
    "pywebview==6.2.1",
    "pypdfium2==5.13.0",
]

[project.scripts]
jarvis-desktop = "app.ui.desktop:launch_desktop"

[project.optional-dependencies]
voice = [
    "sounddevice==0.5.5",
    "google-genai>=2.3.0,<3.0.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "quickjs==1.19.4",
]
package = [
    "pyinstaller==6.22.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
